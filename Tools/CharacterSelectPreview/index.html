 <section class="side left" data-character="Kait"><img class="art" src="kait.jpg" alt="真琴原版CG，挥舞大剑"><div class="shade"></div><div class="num">01</div><div class="info"><div class="eyebrow">逐影剑锋 · 蓄势连斩</div><h2>KAIT</h2><div class="tags"><span>大剑</span><span>助跑蓄势</span><span>击杀转向</span></div><p class="desc">以助跑积蓄斩击力量，击破敌人后自由转向。<br>读准路线，让每一次击杀成为下一斩的起点。</p><button class="choose" data-pick="Kait" aria-pressed="false"><span>选择 Kait</span><b>→</b></button></div></section>

<script>
const stage=document.getElementById('stage');function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s})`;stage.style.left=`${(innerWidth-1920*s)/2}px`;stage.style.top=`${(innerHeight-1080*s)/2}px`}addEventListener('resize',fit);fit();function pick(name){document.querySelectorAll('[data-pick]').forEach(b=>{const on=b.dataset.pick===name;b.setAttribute('aria-pressed',String(on));b.querySelector('span').textContent=on?'已选择 '+name:'选择 '+b.dataset.pick;b.querySelector('b').textContent=on?'✓':'→'});document.getElementById('status').textContent=name?'已选择 '+name+' · 预览不启动游戏':'点击角色进行选择'}document.querySelectorAll('.side').forEach(s=>s.addEventListener('click',()=>pick(s.dataset.character)));document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();pick(b.dataset.pick)}));document.getElementById('reset').onclick=()=>pick(null);
</script></html>
