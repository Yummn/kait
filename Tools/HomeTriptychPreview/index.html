<style>
*{box-sizing:border-box}body{margin:0;background:#100e17;color:#fff;font-family:'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}header{height:66px;display:flex;gap:12px;align-items:center;padding:0 24px;background:#1d1925;border-bottom:1px solid #ffffff18}header strong{margin-right:auto;font-size:15px;font-weight:500;color:#d2c9d9}header button{padding:10px 17px;border-radius:6px;background:#302938;border:1px solid #ffffff18;color:#c5bbca}header button[aria-pressed=true]{color:#251e2b;background:#fac7b7}#window{position:relative;width:100%;height:calc(100vh - 104px);overflow:hidden}#stage{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:var(--bg);--bg:#29232f;--fg:#fff2e8;--muted:#b5a4b5;--accent:#fac7b7;--lt:40%;--lb:28%;--rt:72%;--rb:60%;color:var(--fg)}.artside{position:absolute;inset:0;padding:0;border:0;background:transparent;color:white;text-align:left;outline:none}.artside.left{clip-path:polygon(0 0,var(--lt) 0,var(--lb) 100%,0 100%)}.artside.right{clip-path:polygon(var(--rt) 0,100% 0,100% 100%,var(--rb) 100%)}.frame{position:absolute;top:0;height:100%;width:880px;overflow:hidden}.left .frame{left:-50px}.right .frame{right:-50px}.float{width:100%;height:100%;animation:drift 7s ease-in-out infinite}.right .float{animation-delay:-3.5s}.cg{width:100%;height:100%;object-fit:cover;object-position:48% center;transform:scale(1.035);filter:brightness(.65) saturate(.75);transition:transform .65s cubic-bezier(.2,.7,.2,1),filter .5s}.right .cg{object-position:52% center}.artside:hover .cg{transform:scale(1.075);filter:brightness(.97) saturate(1)}.artside[aria-pressed=true] .cg{transform:scale(1.09);filter:brightness(1) saturate(1.04)}.artside[aria-pressed=true]:hover .cg{transform:scale(1.12)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#08091844,transparent 30%,transparent 45%,#100e2266 65%,#100d1fea)}.nameplate{position:absolute;bottom:90px;width:440px;transition:transform .5s}.left .nameplate{left:65px}.right .nameplate{right:54px}.nameplate small{font-size:17px;letter-spacing:4px;color:#dec8df}.nameplate h2{font-size:62px;letter-spacing:4px;margin:10px 0 16px;line-height:1}.nameplate p{font-size:20px;color:#e7d6e5;margin:0;line-height:1.8}.selectedmark{display:inline-block;margin-top:22px;border:1px solid #ffffff50;padding:8px 16px;font-size:16px;letter-spacing:3px;opacity:0;transition:opacity .35s}.artside[aria-pressed=true] .selectedmark{opacity:1}.artside[aria-pressed=true] .nameplate{transform:translateY(-8px)}.slash{position:absolute;inset:0;background:var(--accent);pointer-events:none;filter:drop-shadow(0 0 6px #fac7b755)}.slash.one{clip-path:polygon(calc(var(--lt) - .1%) 0,calc(var(--lt) + .1%) 0,calc(var(--lb) + .1%) 100%,calc(var(--lb) - .1%) 100%)}.slash.two{clip-path:polygon(calc(var(--rt) - .1%) 0,calc(var(--rt) + .1%) 0,calc(var(--rb) + .1%) 100%,calc(var(--rb) - .1%) 100%)}.menu{position:absolute;width:388px;left:766px;top:135px;text-align:center}.logo{font-size:68px;font-weight:800;letter-spacing:12px;margin:10px 0 2px}.sublogo{font-size:12px;letter-spacing:6px;color:var(--muted)}.ornament{height:1px;width:68px;background:var(--accent);margin:37px auto 25px}.character{font-size:20px;letter-spacing:3px;margin-bottom:8px}.styleline{font-size:15px;color:var(--muted);margin-bottom:50px}.actions{display:flex;flex-direction:column;gap:16px}.actions button{width:100%;height:72px;border:1px solid #ffffff22;background:#ffffff06;color:var(--fg);border-radius:9px;font-size:23px;letter-spacing:3px;transition:transform .2s,background .25s}.actions button:hover{transform:translateY(-3px);background:#ffffff16}.actions button:active{transform:scale(.98)}.actions .start{background:var(--accent);color:#302630;border:0;height:84px;font-size:26px;font-weight:600}.actions .start:hover{background:#ffdbcc}.actions .minor{display:flex;gap:16px}.actions .minor button{font-size:21px}.savehint{font-size:13px;color:var(--muted);margin:13px 0 0}.seal{position:absolute;left:calc(50% - 110px);bottom:72px;width:220px;text-align:center;font-size:12px;letter-spacing:4px;color:var(--muted)}.brandmini{position:absolute;left:60px;top:42px;font-size:14px;letter-spacing:4px;pointer-events:none}.version{position:absolute;right:52px;top:42px;font-size:13px;letter-spacing:3px;pointer-events:none}.bottom{height:38px;padding:8px 24px;color:#b6aabb;font-size:12px;display:flex;justify-content:space-between}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#111019bf;backdrop-filter:blur(8px);z-index:10}.modal[hidden]{display:none}.sheet{width:740px;background:var(--bg);padding:45px 55px;border:1px solid #ffffff28;border-radius:18px;box-shadow:0 20px 100px #0007;color:var(--fg)}.sheet h3{font-size:32px;margin:0 0 24px}.sheet p{font-size:23px;line-height:1.9;margin:14px 0}.sheet button{margin-top:26px;border:0;background:var(--accent);color:#302630;border-radius:7px;padding:14px 35px;font-size:22px}.sheet label{display:block;font-size:22px;margin:20px 0}.sheet input[type=range]{width:100%;accent-color:#d79fac}.sheet input[type=checkbox]{width:20px;height:20px;accent-color:#d79fac}.mode-b{--bg:#f5ebe3!important;--fg:#51444e!important;--muted:#9b8993!important;--lt:37%!important;--lb:31%!important;--rt:69%!important;--rb:63%!important;--accent:#dfad9e!important}.mode-b .menu{top:158px}.mode-b .logo{font-family:Georgia,serif;font-weight:500;letter-spacing:14px}.mode-b .actions button{border-color:#927d8730;background:#5d4f5705}.mode-b .actions .start{background:#5d4f57;color:#fff3e9}.mode-b .actions button:hover{background:#dbc7c266}.mode-b .actions .start:hover{background:#74616d}.mode-b .slash{filter:none}.mode-b .frame{width:890px}.mode-b .sheet{border-color:#b3a0a8}.mode-c{--bg:#181c25!important;--fg:#eaf5f5!important;--muted:#889da8!important;--accent:#92d3d4!important;--lt:41%!important;--lb:25%!important;--rt:75%!important;--rb:59%!important}.mode-c .menu{top:124px}.mode-c .logo{font-style:italic;letter-spacing:4px;font-size:82px}.mode-c .actions button{border-radius:2px}.mode-c .actions .minor{flex-direction:column;gap:12px}.mode-c .actions .minor button{height:58px}.mode-c .styleline{margin-bottom:32px}.mode-c .nameplate h2{font-style:italic}.mode-c .frame{width:940px}.mode-c .left .nameplate{left:45px}.mode-c .right .nameplate{right:35px}.mode-c .ornament{width:150px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}.paused .float{animation-play-state:paused}.artside:focus-visible .nameplate{outline:2px solid #fff;outline-offset:15px}@keyframes drift{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}@media(prefers-reduced-motion:reduce){.float{animation:none}*{transition:none!important}}
</style>
<header><strong>主界面构图预览</strong><button data-mode="a" aria-pressed="true">A · 烟墨双境</button><button data-mode="b" aria-pressed="false">B · 奶油画廊</button><button data-mode="c" aria-pressed="false">C · 冷光锋线</button></header>
<div id="window"><main id="stage" class="mode-a">
<button class="artside left" data-char="Kait" aria-label="选择 Kait" aria-pressed="true"><div class="frame"><div class="float"><img class="cg" src="../CharacterSelectPreview/kait.jpg" alt="Kait原版CG"></div></div><div class="shade"></div><div class="nameplate"><small>蓄势连斩 / SWORD</small><h2>KAIT</h2><p>助跑蓄势 · 击杀转向<br>让每一次击杀，延续下一斩。</p><span class="selectedmark">✓ 已选中</span></div></button>
<button class="artside right" data-char="Yummn" aria-label="选择 Yummn" aria-pressed="false"><div class="frame"><div class="float"><img class="cg" src="../CharacterSelectPreview/yummn.jpg" alt="Yummn原版CG"></div></div><div class="shade"></div><div class="nameplate"><small>气息轮转 / FIST</small><h2>YUMMN</h2><p>气与残影 · 三宗派构筑<br>在爆发与恢复之间掌握节奏。</p><span class="selectedmark">✓ 已选中</span></div></button>
<div class="slash one"></div><div class="slash two"></div><div class="brandmini">DUAL FATES</div><div class="version">MAIN MENU / CONCEPT</div>
<section class="menu"><div class="logo">KAIT</div><div class="sublogo">TWO PATHS. ONE WORLD.</div><div class="ornament"></div><div class="character" id="current">Kait</div><div class="styleline" id="styleline">大剑 · 蓄势 · 连斩</div><div class="actions"><button id="continue">继续游戏</button><button id="start" class="start">开始游戏　→</button><div class="minor"><button id="tutorial">玩法教程</button><button id="settings">设置</button></div></div><p class="savehint" id="savehint">Kait 的存档 · 示例展示</p></section><div class="seal">CHOOSE YOUR OWN PATH</div>
<div class="modal" id="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title"></h3><div id="modal-body"></div><button id="close">返回主界面</button></section></div>
</main></div><div class="bottom"><span id="caption">A：烟墨底色与桃色双斜线，延续游戏右侧简约配色。</span><span>选人不会开始游戏 · 动效与菜单可点击体验 · 存档为演示</span></div>
<script>
const stage=document.getElementById('stage'), viewport=document.getElementById('window');let selected='Kait',mode='a',lastFocus;
function fit(){const s=Math.min(viewport.clientWidth/1920,viewport.clientHeight/1080);stage.style.transform=`scale(${s})`;stage.style.left=`${(viewport.clientWidth-1920*s)/2}px`;stage.style.top=`${(viewport.clientHeight-1080*s)/2}px`}addEventListener('resize',fit);fit();
const captions={a:'A：烟墨底色与桃色双斜线，延续游戏右侧简约配色。',b:'B：奶油色中央留白、收敛斜角，像一张双角色收藏画。',c:'C：更锐利的双斜线与冷光边缘，人物更有迎面而来的力量感。'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;stage.className='mode-'+mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('caption').textContent=captions[mode]});
document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{selected=b.dataset.char;document.querySelectorAll('[data-char]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('current').textContent=selected;document.getElementById('styleline').textContent=selected==='Kait'?'大剑 · 蓄势 · 连斩':'拳斗 · 气与残影 · 三宗派';document.getElementById('savehint').textContent=selected+' 的存档 · 示例展示'});
function modal(title,html){lastFocus=document.activeElement;document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').hidden=false;document.getElementById('close').focus()}
function close(){document.getElementById('modal').hidden=true;lastFocus?.focus()};document.getElementById('close').onclick=close;
document.getElementById('tutorial').onclick=()=>modal(selected+' · 玩法教程',selected==='Kait'?'<p>① 滑动或按方向键，同时操作两个棋盘。</p><p>② 助跑积蓄斩击力量，击杀后可以继续转向。</p><p>③ 合成构筑，规划连斩路线，避开敌人的预警。</p><p style="font-size:15px;opacity:.6">这是联动示意，正式接入将打开 Kait 的完整教程。</p>':'<p>① 高速滑行消耗气；气竭后步行与恢复。</p><p>② 利用残影与击杀回气，掌握爆发节奏。</p><p>③ 混搭散打、四象、暗影三宗派，留意敌方预警。</p><p style="font-size:15px;opacity:.6">这是联动示意，正式接入将打开 Yummn 的漫画教程。</p>');
document.getElementById('settings').onclick=()=>{modal('设置 · 预览','<label>界面动效 <input id="motion" type="checkbox" '+(!stage.classList.contains('paused')?'checked':'')+'></label><p style="font-size:17px;opacity:.7">仅控制预览中的轻微浮动，不修改游戏设置。</p>');document.getElementById('motion').onchange=e=>stage.classList.toggle('paused',!e.target.checked)};
document.getElementById('start').onclick=()=>modal('开始 '+selected+' 的旅程','<p>已确认角色：'+selected+'。</p><p>正式界面将在这一步创建新局，而不是点击人物时开始。</p><p style="font-size:16px;opacity:.6">当前为预览，没有启动游戏，也没有覆盖任何存档。</p>');
document.getElementById('continue').onclick=()=>modal('继续 '+selected+' 的旅程','<p>统一入口只读取当前选中角色的存档。</p><p>正式版中，没有对应存档时此入口隐藏；切换人物会同步更新。</p><p style="font-size:16px;opacity:.6">本预览使用示例状态，不读取真实存档。</p>');
addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!document.getElementById('modal').hidden){const nodes=[...document.querySelectorAll('#modal button,#modal input')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
</script></html>
